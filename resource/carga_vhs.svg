      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.5" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="32" y="52" opacity="0">¤§▓X&amp;Ψ░@<tspan x="32" dy="22">Ξ&amp;░#Ψ§Ж▓</tspan>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.6" dur="6s" repeatCount="indefinite"/>
