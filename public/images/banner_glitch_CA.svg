<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="tear" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.18" numOctaves="1" seed="1" result="n">
        <animate attributeName="seed" calcMode="discrete" values="1;4;9;2;7;5;12;3" dur="0.9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" calcMode="discrete" values="4;4;70;4;120;4;4;40;4;4" keyTimes="0;0.2;0.3;0.38;0.5;0.58;0.7;0.78;0.86;0.95" dur="2.4s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity="0.45"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="80%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <g id="base" font-family="'Courier New',monospace" font-weight="bold" fill="#26619C">
      <text x="760" y="178" font-size="104" text-anchor="middle" letter-spacing="14">I AM AWAKE</text>
      <text x="760" y="298" font-size="104" text-anchor="middle" letter-spacing="14">I AM GOD</text>
      <polyline points="0,190 24,179 38,195 61,124 89,191 103,213 117,192 146,167 176,197 206,203 236,166 255,202 271,199 287,140 317,203 334,203 364,188 387,202 401,125 419,228 444,202 470,226 493,193 510,191 524,186 552,203 578,205 592,202 617,200 633,213 646,180 675,190 697,198 724,226 738,194 758,168 771,220 792,212 818,208 842,198 854,205 871,139 898,197 919,197 943,223 957,204 981,181 997,205 1026,208 1051,207 1075,194 1089,194 1108,190 1120,235 1137,195 1149,203 1178,205 1208,190 1236,277 1249,231 1273,211 1297,201 1321,197 1335,204 1352,199 1365,194 1395,207 1410,205 1422,197 1446,210 1466,205 1489,175 1504,207 1530,221 1551,196 1566,197 1586,180" fill="none" stroke="#26619C" stroke-width="3" opacity="0.3"/>
      <rect x="0" y="48" width="1600" height="4"/>
      <rect x="0" y="348" width="1600" height="4"/>
    </g>
  </defs>

  <rect width="1600" height="400" fill="#000"/>

  <!-- fantasmas desplazados (separación de canal, mismo color) -->
  <use href="#base" opacity="0.30" filter="url(#tear)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="-14 0;10 2;-22 -2;6 0;-14 0" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <use href="#base" opacity="0.30" filter="url(#tear)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="14 0;-8 -2;20 2;-6 0;14 0" dur="1.5s" repeatCount="indefinite"/>
  </use>

  <!-- capa principal distorsionada -->
  <g filter="url(#glow)">
    <use href="#base" filter="url(#tear)">
      <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;3 0;-4 1;0 0;0 0;6 -1;0 0" dur="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

